<!DOCTYPE html>
<html lang="en">
<head>

  <title>{% block title %}UAE Compliance Copilot{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

    <header>
      <h1><a href="/" style="color:inherit;text-decoration:none;">UAE Compliance Copilot</a></h1>
